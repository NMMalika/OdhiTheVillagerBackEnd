  <!-- SEO -->
  <title>{% block title %}Odhi The Villager | Benga Music from Kenya to the World{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Odhithe Villager is a top Kenyan Benga artist creating soulful Luo music blending culture and rhythm. Discover his latest songs, videos, and performances.{% endblock %}">
  <meta name="keywords" content="{% block meta_keywords %}Odhithe Villager, Benga music, Kenyan music, Luo artist, Benga songs, Benga Kenya{% endblock %}">

  <link rel="canonical" href="https://www.odhithevillager.com/">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicGroup",
      "name": "Odhithe Villager",
      "genre": "Benga",
      "url": "https://www.odhithevillager.com/",
      "image": "https://www.odhithevillager.com/static/img/odhithevillager.jpg",
      "description": "Odhithe Villager is a leading Benga artist from Kenya known for authentic Luo music blending rhythm, tradition, and modern sound.",
      "sameAs": [
        "https://www.youtube.com/@odhithevillager",
        "https://www.instagram.com/odhithevillager",
        "https://www.facebook.com/odhithevillager",
        "https://open.spotify.com/artist/odhithevillager"
      ],
      "foundingLocation": {
        "@type": "Place",
        "name": "Homa Bay, Kenya"
      },
      "member": {
        "@type": "Person",
        "name": "Odhi the Villager"
      }
    }
    </script>
